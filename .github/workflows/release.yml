# Builds Bikini Bottom Builder and publishes it.
#
# Push a tag such as v1.2 to create a GitHub Release with the Windows .exe, the Linux .AppImage
# and the .html attached:
#   git tag v1.2
#   git push origin v1.2
#
# You can also run it by hand from the Actions tab ("Run workflow"); the files are then
# attached to the run as a downloadable artifact instead of a release.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod

      - name: Install mingw (for the Windows icon and version info)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build
        run: |
          sh desktop/build.sh
          sh desktop/build_appimage.sh
          mkdir -p dist
          cp desktop/BikiniBottomBuilder.exe dist/
          cp desktop/BikiniBottomBuilder-x86_64.AppImage dist/
          cp editor/dist/BikiniBottomBuilder-local.html dist/BikiniBottomBuilder.html

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BikiniBottomBuilder
          path: dist/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
